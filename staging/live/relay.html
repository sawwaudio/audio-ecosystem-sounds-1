<!doctype html><meta charset="utf-8"><title>relay</title><p id="s">loading…</p>
<script>
// 一時：Instagram / Meta Business Suite の投稿画面（CSPで外部fetch不可）へ動画ファイルを渡すための中継。f=a.bin,b.bin&n=a.mp4,b.mp4&to=https://business.facebook.com。投稿が終わったら staging ごと削除する。
const q=new URLSearchParams(location.search),fs=(q.get('f')||'').split(','),ns=(q.get('n')||'').split(','),to=q.get('to')||'https://www.instagram.com';
Promise.all(fs.map(f=>fetch('../'+f).then(r=>r.arrayBuffer()))).then(bs=>{document.getElementById('s').textContent='sending '+bs.length;
 if(window.opener){window.opener.postMessage({saeFiles:true,files:bs.map((b,i)=>({name:ns[i]||('video'+i+'.mp4'),buf:b}))},to,bs);document.getElementById('s').textContent='sent';setTimeout(()=>window.close(),800)}})
 .catch(e=>document.getElementById('s').textContent='ERR '+e);
</script>
